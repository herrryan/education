version: '3.0'

services:
  education:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/herrryan/education:latest
    container_name: education-platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8133}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
